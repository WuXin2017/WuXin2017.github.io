<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>兩【宋】飯</title>
    <style>
        /* 基本樣式 */
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        /* 聯絡資訊區塊 */
        .contact-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .contact-info a {
            color: #FF6B6B;
            text-decoration: none;
            margin-right: 15px;
        }

        /* 菜單項目 */
        .menu-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 數量選擇器 */
        .quantity {
            width: 60px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* 提交按鈕 */
        #submitBtn {
            background: #FF6B6B;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }
        #submitBtn:hover {
            background: #FF5252;
        }

        /* 電話輸入 */
        #phone {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <input 
    type="text" 
    id="name" 
    placeholder="請輸入您的姓名 (例如：陳大文)" 
    required
    style="width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;"
>
    <!-- 聯絡電話 -->
    <input 
    type="tel" 
    id="phone" 
    placeholder="請輸入聯絡電話 (範例：61234567)" 
    pattern="[0-9]{8}"
    required
>

    <button id="submitBtn" onclick="submitOrder()">✅ 提交訂單</button>

    <script>
      function submitOrder() {
          // 獲取姓名
          const name = document.getElementById('name').value;
          if (name.trim() === "") {
              alert('請輸入您的姓名');
              return;
          }
  
          // 香港電話驗證
          const phone = document.getElementById('phone').value;
          if (!/^[0-9]{8}$/.test(phone)) {
              alert('請輸入8位數字電話號碼');
              return;
          }
  
          // 獲取訂單內容
          const items = Array.from(document.querySelectorAll('.item:checked')).map(item => {
              return {
                  name: item.dataset.name,
                  price: item.dataset.price,
                  quantity: item.parentElement.nextElementSibling.value
              };
          });
  
          if (items.length <= 1) {
              alert('請至少選擇兩個組合！');
              return;
          }
  
          // 組合訂單訊息 (已修正)
          let message = `👤 姓名：${name}\n`;
          message += `📱 電話：${phone}\n\n`;
          message += "📝 訂購項目：\n";
          
          let total = 0;
          items.forEach((item, index) => {
              message += `${index + 1}. ${item.name} x${item.quantity}\n`;
              total += item.price * item.quantity;
          });
          message += `\n💰 總金額：$${total}`;
  
          // 寄送郵件
          fetch('https://formspree.io/f/你的FormspreeID', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                  subject: '新訂單通知',
                  message: message 
              })
          })
          .then(() => {
              alert('訂單已送出！我們將盡快與您確認。');
              location.reload();
          })
          .catch(() => alert('提交失敗，請直接電話聯繫！'));
      }
  </script>
